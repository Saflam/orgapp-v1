<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#174b3d">
    <title>You're offline — Saflivo</title>
    <style>
        :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fafaf8; color: #172033; padding: 24px; }
        main { max-width: 440px; padding: 36px; border: 1px solid #e2e8f0; border-radius: 28px; background: white; box-shadow: 0 24px 70px -38px #0f172a; }
        .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; background: #174b3d; color: white; font-weight: 800; }
        h1 { margin: 24px 0 10px; font-size: 28px; letter-spacing: -.04em; }
        p { line-height: 1.65; color: #64748b; }
        button { margin-top: 12px; border: 0; border-radius: 999px; background: #174b3d; color: white; padding: 12px 18px; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>You're offline</h1>
    <p>Saflivo couldn't reach the network. Reconnect and try again. For your security, sign-in pages and organization data are not stored for offline use.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
</main>
</body>
</html>
