$kind: http-request
description: Matches POST /api/v1/login/otp/request. Controller validates email, calls AuthenticationService::requestEmailOtp, and returns message + challenge_id. Use an existing user email.
url: "{{baseUrl}}/api/v1/login/otp/request"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const body = pm.response.json();
        if (body.challenge_id !== undefined) pm.collectionVariables.set('challengeId', String(body.challenge_id));
        pm.test('Successful OTP request returns challenge_id', function () { pm.expect(body.challenge_id).to.exist; });
      }
    language: text/javascript
order: 1000
