$kind: http-request
description: Matches the auth:sanctum route GET /api/v1/auth/me. Requires the
  token from step 2.
url: "{{baseUrl}}/api/v1/auth/me"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Authenticated user endpoint returns 200', function () { pm.response.to.have.status(200); });
      pm.test('Response includes user email and id', function () {
        const body = pm.response.json();
        pm.expect(body.user).to.have.property('id');
        pm.expect(body.user).to.have.property('email');
      });
    language: text/javascript
order: 2000
