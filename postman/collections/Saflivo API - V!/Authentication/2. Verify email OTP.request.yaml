$kind: http-request
description: Matches POST /api/v1/login/otp/verify. The controller expects
  integer challenge_id and a six-digit code. On success, returns token and
  token_type.
url: "{{baseUrl}}/api/v1/login/otp/verify"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "challenge_id": "{{challengeId}}",
      "code": "{{otpCode}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const body = pm.response.json();
        if (body.token) pm.collectionVariables.set('token', body.token);
        pm.test('Successful verification returns a bearer token', function () {
          pm.expect(body.token).to.be.a('string');
          pm.expect(body.token_type).to.eql('Bearer');
        });
      }
    language: text/javascript
order: 1403
